name: Deploy edition

# Manual trigger ONLY. The developer consciously decides when to publish.
# Never deploy automatically on push to main.
on:
  workflow_dispatch:

permissions:
  contents: write

# Prevent two manual runs from clobbering the gh-pages branch at the same time.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the source (main).
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 2. Install dependencies and build → produces dist/
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 3. Read the current edition metadata from src/config/edition.js.
      #    We import the ES module directly so we never re-parse the JS by hand.
      - name: Read current edition metadata
        id: edition
        run: |
          node --input-type=module <<'EOF'
          import { pathToFileURL } from 'node:url'
          import { appendFileSync } from 'node:fs'
          import { resolve } from 'node:path'
          const url = pathToFileURL(resolve('src/config/edition.js')).href
          const { currentEdition } = await import(url)
          const out = process.env.GITHUB_OUTPUT
          appendFileSync(out, `slug=${currentEdition.slug}\n`)
          appendFileSync(out, `name=${currentEdition.name}\n`)
          appendFileSync(out, `year=${currentEdition.year}\n`)
          console.log(`Resolved edition: ${currentEdition.slug} (${currentEdition.year})`)
          EOF

      # 4. Publish to gh-pages. Each edition lives in its own /<slug>/ folder and
      #    the branch root is a redirect that always points at the current edition.
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.edition.outputs.slug }}
          NAME: ${{ steps.edition.outputs.name }}
          YEAR: ${{ steps.edition.outputs.year }}
        run: |
          set -euo pipefail

          # Fail fast if the slug could not be read — it guards every rm/cp below.
          : "${SLUG:?edition slug is empty — check src/config/edition.js}"

          GHP=/tmp/gh-pages
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # This edition's absolute URL: host from the owner, path from repo + slug.
          OWNER="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          REPO="${GITHUB_REPOSITORY##*/}"
          EDITION_URL="https://${OWNER}.github.io/${REPO}/${SLUG}"
          echo "Edition URL: ${EDITION_URL}/"

          rm -rf "$GHP"

          # Checkout gh-pages (or start an orphan branch on the very first deploy).
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            echo "Existing gh-pages branch found — cloning it."
            git clone --branch gh-pages --single-branch "$REMOTE" "$GHP"
          else
            echo "No gh-pages branch yet — initializing a fresh orphan branch."
            git clone --depth 1 "$REMOTE" "$GHP"
            git -C "$GHP" checkout --orphan gh-pages
            git -C "$GHP" rm -rf . >/dev/null 2>&1 || true
            git -C "$GHP" clean -fdx >/dev/null 2>&1 || true
          fi

          # Clean the branch root: keep .git and every EDITION folder (a top-level
          # directory that directly contains an index.html). This preserves past
          # editions while dropping the root redirect, metadata and any leftovers
          # from the previous root-based layout (assets/, data/, archive/, ...).
          shopt -s dotglob nullglob
          for entry in "$GHP"/*; do
            name="$(basename "$entry")"
            [ "$name" = ".git" ] && continue
            if [ -d "$entry" ] && [ -f "$entry/index.html" ]; then
              echo "Keeping existing edition: $name"
              continue
            fi
            rm -rf -- "${entry:?}"
          done
          shopt -u dotglob nullglob

          # Replace this edition's folder with the freshly built site.
          rm -rf "${GHP:?}/${SLUG:?}"
          mkdir -p "$GHP/$SLUG"
          cp -R "$GITHUB_WORKSPACE/dist/." "$GHP/$SLUG/"

          # Inject the absolute edition URL where the placeholder appears
          # (canonical, Open Graph, JSON-LD, sitemap, robots).
          grep -rlZ --exclude-dir=assets '__SITE_URL__' "$GHP/$SLUG" 2>/dev/null \
            | xargs -0 -r sed -i "s#__SITE_URL__#${EDITION_URL}#g" || true

          # Write the root redirect that always points at the current edition.
          cat > "$GHP/index.html" <<HTML
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>/DH.arc seminars</title>
              <link rel="canonical" href="${EDITION_URL}/" />
              <meta name="robots" content="noindex" />
              <meta http-equiv="refresh" content="0; url=./${SLUG}/" />
              <script>location.replace("./${SLUG}/" + location.hash)</script>
            </head>
            <body>
              <p>Redirecting to the current edition… <a href="./${SLUG}/">Continue</a></p>
            </body>
          </html>
          HTML

          # Root housekeeping: disable Jekyll and record the current edition.
          touch "$GHP/.nojekyll"
          jq -n --arg slug "$SLUG" --arg name "$NAME" --argjson year "$YEAR" \
            '{slug: $slug, name: $name, year: $year}' > "$GHP/.edition-meta.json"

          # Commit and push to gh-pages.
          cd "$GHP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit."
          else
            git commit -m "Deploy edition: $SLUG ($YEAR)"
            git push origin gh-pages
            echo "Published '$SLUG' at ${EDITION_URL}/"
          fi